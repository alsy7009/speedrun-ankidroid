<!doctype html>
<!-- Speedrun Study Plan dashboard for AnkiDroid. Mirrors the desktop
     qt/aqt/speedrun_plan.py: Today + roadmap timeline + readiness gauge + focus
     areas, with a Plan/Scores toggle. Kotlin injects the body (replacing
     __SR_BODY__). Bridge: window.pycmd -> AndroidSpeedrun.cmd(). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script>
  window.pycmd = function (s) { try { AndroidSpeedrun.cmd(s); } catch (e) {} };
  function showSec(s) {
    var p = s === 'plan';
    document.getElementById('sec-plan').style.display = p ? '' : 'none';
    document.getElementById('sec-scores').style.display = p ? 'none' : '';
    document.getElementById('seg-plan').className = 'seg' + (p ? ' on' : '');
    document.getElementById('seg-scores').className = 'seg' + (p ? '' : ' on');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #f6f1e9; --card: #fffdf9; --ink: #4a4038; --muted: #a89a8b;
  --line: #ece4d7; --sage: #93a888; --sage-deep: #6f8a6c; --blush: #cf9f97;
  --sage-rgb: 147,168,136; --shadow: 0 6px 20px rgba(120,100,70,.08);
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Nunito Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font-family: var(--sans); -webkit-user-select: none;
  overflow-wrap: anywhere; word-break: break-word;
  background: radial-gradient(130% 55% at 50% -10%, #fbf7f0 0%, transparent 55%), var(--cream); }
#wrap { max-width: 680px; margin: 0 auto; padding: 24px 18px 48px; }
.h { font-family: var(--serif); font-size: 30px; font-weight: 700; margin: 0 0 2px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 17px 19px; margin-bottom: 15px; box-shadow: var(--shadow); }
.card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .15em; color: var(--muted); margin: 0 0 11px; }
.today { font-size: 16px; line-height: 1.5; margin-bottom: 13px; }
.today b { color: var(--sage-deep); }
.btn { display: inline-block; background: var(--sage-deep); color: #fff; font-weight: 700;
  border: none; border-radius: 999px; padding: 12px 24px; font-size: 15px; cursor: pointer; }
.btn:active { transform: scale(.98); }
.segbar { display: flex; gap: 8px; margin-bottom: 16px; }
.seg { flex: 1; border: 1.5px solid var(--line); background: var(--card); color: var(--muted);
  font-weight: 700; font-size: 14px; border-radius: 999px; padding: 10px 0; cursor: pointer; }
.seg.on { background: var(--sage-deep); color: #fff; border-color: transparent; }
.track { position: relative; height: 16px; background: var(--line); border-radius: 999px; margin: 14px 0 8px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px;
  background: linear-gradient(90deg, var(--sage), var(--sage-deep)); }
.divider { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--card); }
.marker { position: absolute; top: -7px; width: 3px; height: 30px; background: var(--ink); border-radius: 2px; }
.phases { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted); }
.phases .on { color: var(--sage-deep); }
.cap { color: var(--muted); font-size: 12px; margin-top: 10px; }
.gnum { font-size: 26px; font-weight: 800; }
.grange { color: var(--muted); font-size: 13px; }
.gtrack { position: relative; height: 16px; background: var(--line); border-radius: 999px; margin: 14px 0 4px; }
.gband { position: absolute; top: 0; bottom: 0; background: rgba(var(--sage-rgb), .35); border-radius: 999px; }
.gfill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px;
  background: linear-gradient(90deg, var(--sage), var(--sage-deep)); }
.gscale { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
.focus { display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 11px 0; border-bottom: 1px solid var(--line); }
.focus:last-child { border-bottom: none; }
.focus .name { font-weight: 700; }
.focus .why { color: var(--muted); font-size: 12px; margin-top: 2px; }
.study { flex: none; color: var(--sage-deep); font-weight: 700; background: transparent;
  border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 15px; font-size: 13px; cursor: pointer; }
.score { margin-bottom: 14px; }
.score .t { font-weight: 800; font-size: 15px; }
.score .st { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.score .pt { font-size: 22px; font-weight: 800; }
.subj { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.subj:last-child { border-bottom: none; }
.subj .r { color: var(--muted); flex: none; }
.foot { color: var(--muted); font-size: 11px; margin-top: 14px; }
.sr-back { background: transparent; border: none; color: var(--sage-deep); font-size: 30px;
  line-height: 1; cursor: pointer; padding: 2px 10px 8px 0; margin: 0; }
.sr-back:active { opacity: .6; }
</style>
</head>
<body><div id="wrap"><button class="sr-back" onclick="pycmd('sr:close')" aria-label="Back">&#8592;</button>__SR_BODY__</div></body>
</html>
